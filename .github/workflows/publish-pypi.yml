name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build deps
        run: python -m pip install --upgrade pip build setuptools wheel

      - name: Require successful checks for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          gh run list --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --branch main --event push --limit 100 --json workflowName,headSha,status,conclusion,databaseId,event,headBranch > evidence/ci-runs.json
          python scripts/release_artifacts.py --dist dist --ref "$GITHUB_REF" --sha "$GITHUB_SHA" --runs evidence/ci-runs.json --report evidence/release.json --check-runs-only

      - name: Build sdist and wheel once
        run: python -m build --no-isolation

      - name: Bind package version and bytes to the release tag
        run: python scripts/release_artifacts.py --dist dist --ref "$GITHUB_REF" --sha "$GITHUB_SHA" --runs evidence/ci-runs.json --report evidence/release.json

      - name: Smoke the exact release artifacts
        run: python scripts/wheel_smoke.py --wheel dist/*.whl --sdist dist/*.tar.gz --report evidence/smoke.json --check-rag-extra

      - name: Verify the tested bytes before upload
        run: python scripts/release_artifacts.py --verify --dist dist --ref "$GITHUB_REF" --sha "$GITHUB_SHA" --report evidence/release.json --smoke evidence/smoke.json --require-rag-extra

      - name: Upload artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - name: Upload release evidence separately
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.1
        with:
          name: release-evidence
          path: evidence/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write # Required for OIDC trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Download release evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-evidence
          path: evidence/

      - name: Verify downloaded distributions match the tested bytes
        run: python scripts/release_artifacts.py --verify --dist dist --ref "$GITHUB_REF" --sha "$GITHUB_SHA" --report evidence/release.json --smoke evidence/smoke.json --require-rag-extra

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.14.0
        # No token — uses OIDC trusted publishing.
        # REQUIRES a pending publisher on pypi.org/manage/account/publishing/:
        #   - project:     attune-verify
        #   - owner:       Smart-AI-Memory
        #   - repo:        attune-verify
        #   - workflow:    publish-pypi.yml   (the FILENAME, not the YAML name)
        #   - environment: pypi
